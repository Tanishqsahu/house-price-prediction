<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | House Price Predictor</title>
    <style>
        :root { --primary: #2c3e50; --secondary: #27ae60; --light: #ecf0f1; }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), 
                        url('https://images.unsplash.com/photo-1564013799919-ab600027ffc6?ixlib=rb-4.0.3&auto=format&fit=crop&w=1470&q=80');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }
        .hero-content {
            padding: 20px;
            max-width: 800px;
        }
        h1 { font-size: 3.5rem; margin-bottom: 20px; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
        p { font-size: 1.2rem; margin-bottom: 30px; line-height: 1.6; }
        .btn {
            display: inline-block;
            background-color: var(--secondary);
            color: white;
            padding: 15px 40px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .btn:hover {
            background-color: #219150;
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

<div class="hero-content">
    <h1>Smart Real Estate Valuation</h1>
    <p>
        Harness the power of Machine Learning to get instant, accurate house price estimates. 
        Our model analyzes over 14 key features including living area, location, and property age 
        to help you make data-driven decisions.
    </p>
    <a href="{{ url_for('predict_datapoint') }}" class="btn">Get Started</a>
</div>

</body>
</html>
